<!doctype html>
<html lang="en" data-mode="general">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PETER</title>
<meta name="description" content="PETER. Write the petition, ask your question, and wait. An entertainment illusion.">
<meta name="theme-color" content="#04060a">
<meta name="application-name" content="PETER">
<meta property="og:title" content="PETER">
<meta property="og:description" content="Ask carefully.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%237dd3fc' stroke-width='1.4' opacity='.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%237dd3fc' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%237dd3fc'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/avatar.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/console.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>

<a class="skip-link" href="#question-form">Skip to the question</a>

<!-- ================= atmosphere ================= -->
<div class="atmosphere" aria-hidden="true">
  <canvas id="particles"></canvas>
  <div class="aura aura--a"></div>
  <div class="aura aura--b"></div>
  <div class="overlay"></div>
  <div class="grain"></div>
</div>
<div class="veil" id="veil" aria-hidden="true"></div>
<div class="glitch-layer" id="glitch-layer" aria-hidden="true"></div>

<!-- ================= shell ================= -->
<div class="shell" id="shell">

  <header class="masthead">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">PETER</span>
    </div>

    <div class="masthead__tools">
      <button class="icon-btn" id="btn-sound" type="button" aria-pressed="false"
              title="Ambient sound" aria-label="Toggle ambient sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </button>

      <button class="icon-btn" id="btn-voice" type="button" aria-pressed="false"
              title="Peter's voice" aria-label="Toggle Peter's voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
        </svg>
      </button>

      <button class="icon-btn" id="btn-motion" type="button" aria-pressed="false"
              title="Reduce motion" aria-label="Toggle reduced motion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
      </button>

      <button class="icon-btn" id="btn-settings" type="button" aria-expanded="false" aria-controls="settings-panel"
              title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ================= stage ================= -->
  <main class="stage" id="main">

    <!-- ---------- Peter ---------- -->
    <section class="oracle-col" aria-labelledby="peter-heading">
      <h1 id="peter-heading" class="visually-hidden">PETER</h1>

      <figure class="peter" id="peter" data-state="idle" data-blink="0" role="img"
              aria-label="PETER: a slowly breathing eye">
        <div class="peter__halo"></div>
        <div class="peter__body">
          <svg class="peter__glyph" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="socketGrad" cx="50%" cy="46%" r="58%">
                <stop offset="0%"   stop-color="rgba(255,255,255,.055)"/>
                <stop offset="62%"  stop-color="rgba(255,255,255,.014)"/>
                <stop offset="100%" stop-color="rgba(0,0,0,.45)"/>
              </radialGradient>
              <radialGradient id="irisGrad" cx="50%" cy="42%" r="62%">
                <stop offset="0%"   stop-color="var(--accent)" stop-opacity=".55"/>
                <stop offset="46%"  stop-color="var(--accent-deep)" stop-opacity=".42"/>
                <stop offset="100%" stop-color="#03060c" stop-opacity=".95"/>
              </radialGradient>
              <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="var(--accent)" stop-opacity="0"/>
                <stop offset="50%"  stop-color="var(--accent)" stop-opacity=".85"/>
                <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
              </linearGradient>
              <clipPath id="eyeClip"><circle cx="50" cy="50" r="20"/></clipPath>
            </defs>

            <!-- outer architecture -->
            <circle class="ring ring--outer" cx="50" cy="50" r="47"/>
            <circle class="ring ring--ticks" cx="50" cy="50" r="43.5"/>
            <circle class="ring ring--arc"   cx="50" cy="50" r="40"/>
            <circle class="ring ring--mid"   cx="50" cy="50" r="36"/>
            <circle class="ring ring--arc2"  cx="50" cy="50" r="32.5"/>

            <!-- aperture blades -->
            <path class="blade" d="M31 39a24 24 0 0 1 38 0"/>
            <path class="blade" d="M69 61a24 24 0 0 1-38 0"/>
            <path class="blade" d="M28 50a24 24 0 0 1 12-20"/>

            <circle class="ring ring--inner" cx="50" cy="50" r="21.5"/>

            <!-- eye -->
            <g class="peter__eye">
              <circle class="eye__socket" cx="50" cy="50" r="20"/>
              <g class="peter__lidgroup">
                <g class="eye__iris" id="eye-iris">
                  <circle class="iris__disc" cx="50" cy="50" r="12.8"/>
                  <!-- irregular fibres: an iris, not a clock face -->
                  <path class="iris__fibre" d="M50 40.4a9.6 9.6 0 0 1 8.1 4.6"/>
                  <path class="iris__fibre iris__fibre--b" d="M41.2 54.9a9.6 9.6 0 0 1-.7-6.4"/>
                  <path class="iris__fibre" d="M56.4 57.3a9.6 9.6 0 0 1-9.9 1.9"/>
                  <path class="iris__fibre iris__fibre--b" d="M44.6 42.4a12 12 0 0 0-3.4 4.1"/>
                  <circle class="iris__ring" cx="50" cy="50" r="8.9"/>
                  <circle class="iris__rim"  cx="50" cy="50" r="12.8"/>
                  <circle class="iris__pupil" cx="50" cy="50" r="5.9"/>
                  <circle class="iris__core"  cx="50" cy="50" r="1.9"/>
                  <circle class="iris__spec"  cx="46.1" cy="45.6" r="1.05"/>
                </g>
              </g>
              <g clip-path="url(#eyeClip)">
                <rect class="peter__scan" x="28" y="49" width="44" height="1.6" rx=".8"/>
              </g>
            </g>
          </svg>
        </div>
      </figure>

      <div class="peter-caption">
        <p class="peter-caption__line" id="peter-line">Ask carefully.</p>
      </div>

      <div class="status" id="status" data-state="connected" role="status" aria-live="polite"
           title="Connection status">
        <span class="status__dot" aria-hidden="true"></span>
        <span class="status__label" id="status-label">Connection: Stable</span>
      </div>
    </section>

    <h2 id="ask-heading" class="visually-hidden">Ask Peter a question</h2>

      <!-- modes -->
      <div class="panel modes" role="group" aria-labelledby="modes-title">
        <div class="panel__head" style="margin-bottom:.6rem">
          <span class="panel__title" id="modes-title">Channel</span>
          <span class="eyebrow" id="mode-name">General</span>
        </div>
        <div class="modes__viewport">
          <div class="modes__rail" id="modes-rail" role="tablist" aria-label="Oracle channel"></div>
        </div>
        <p class="modes__hint" id="mode-hint"></p>
      </div>

      <!-- question -->
      <form class="panel" id="question-form" novalidate>
        <div class="field">
          <label class="field__label" for="petition">
            <span>Petition</span>
            <span class="field__aside" id="petition-aside">Write it exactly</span>
          </label>
          <div class="input-wrap" id="petition-wrap">
            <input class="field__input field__input--petition" id="petition" name="petition"
                   type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
                   spellcheck="false" enterkeyhint="next"
                   placeholder="Peter, please answer the following question:"
                   aria-describedby="petition-help">
            <div class="petition-progress" id="petition-progress"></div>
          </div>
          <p class="visually-hidden" id="petition-help">
            Type the petition addressed to Peter, then write your question below.
          </p>
        </div>

        <div class="field">
          <label class="field__label" for="question">
            <span>Question</span>
            <span class="field__aside" id="question-counter">0 / 280</span>
          </label>
          <div class="input-wrap">
            <textarea class="field__input" id="question" name="question" rows="2" maxlength="280"
                      autocomplete="off" enterkeyhint="send"
                      placeholder="What do you want to know?"></textarea>
          </div>
        </div>

        <div class="ask-row">
          <button class="btn" id="btn-ask" type="submit">
            <span>Ask Peter</span>
            <span class="btn__kbd" aria-hidden="true">↵</span>
          </button>
          <button class="btn btn--ghost" id="btn-clear" type="button">Clear</button>
        </div>

        <div class="sequence" id="sequence" hidden aria-live="polite" aria-label="Processing"></div>
      </form>

      <!-- answer -->
      <div class="answer" id="answer" aria-live="polite">
        <div class="answer__meta">
          <span id="answer-meta-label">Peter is silent</span>
          <span class="answer__meta-tag" id="answer-meta-tag" hidden></span>
        </div>
        <p class="answer__text is-idle" id="answer-text">Nothing has been asked yet.</p>
        <div class="answer__actions">
          <button class="mini-btn" id="btn-replay" type="button">Speak again</button>
          <button class="mini-btn" id="btn-again" type="button">Ask another</button>
        </div>
        <div class="answer__glowline"></div>
      </div>

      <!-- history -->
      <div class="panel history" id="history-panel">
        <div class="panel__head" style="margin-bottom:.4rem">
          <span class="panel__title">Session history</span>
          <button class="mini-btn" id="btn-clear-session" type="button">Clear</button>
        </div>
        <p class="history__empty" id="history-empty">Peter remembers nothing yet.</p>
        <ol class="history__list" id="history-list"></ol>
      </div>

      <!-- settings -->
      <div class="panel settings" id="settings-panel" hidden>
        <div class="panel__head" style="margin-bottom:.4rem">
          <span class="panel__title">Settings</span>
        </div>
        <div id="settings-rows"></div>
      </div>
  </main>

</div>

<!-- ================= operator console (hidden) ================= -->
<aside class="op" id="op-console" hidden role="dialog" aria-modal="false"
       aria-label="Peter operator console" tabindex="-1"></aside>

<div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div id="protocol-warning">Peter needs JavaScript enabled in order to listen.</div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
